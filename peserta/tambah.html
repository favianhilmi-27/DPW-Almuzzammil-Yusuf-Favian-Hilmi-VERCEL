<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMEVENT | Tambah Penyelenggara</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMEVENT</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../event/list.html">Daftar Event</a></li>
                <li><a href="../event/tambah.html">Tambah Event</a></li>
                <li><a href="list.html">Daftar Penyelenggara</a></li>
                <li><a href="tambah.html" class="aktif">Tambah Penyelenggara</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Penyelenggara</h2>
            <form id="form-tambah">
                <p>
                    <label for="nama">Nama Penyelenggara</label><br>
                    <input type="text" id="nama" name="nama" placeholder="cth: HMTI" required>
                </p>
                <p>
                    <label for="jenis">Jenis</label><br>
                    <select id="jenis" name="jenis">
                        <option value="UKM">UKM</option>
                        <option value="Himpunan">Himpunan</option>
                        <option value="BEM">BEM</option>
                        <option value="Komunitas">Komunitas</option>
                    </select>
                </p>
                <p>
                    <label for="ketua">Nama Ketua</label><br>
                    <input type="text" id="ketua" name="ketua" required>
                </p>
                <p>
                    <label for="no_hp">No. HP</label><br>
                    <input type="text" id="no_hp" name="no_hp">
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMEVENT &mdash; UTS DPW</p>
    </footer>
    <script src="../assets/js/app.js"></script>
</body>
</html>
