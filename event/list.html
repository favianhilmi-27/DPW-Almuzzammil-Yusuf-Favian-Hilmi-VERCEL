<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMEVENT | Daftar Event</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMEVENT</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html" class="aktif">Daftar Event</a></li>
                <li><a href="tambah.html">Tambah Event</a></li>
                <li><a href="../peserta/list.html">Daftar Penyelenggara</a></li>
                <li><a href="../peserta/tambah.html">Tambah Penyelenggara</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Daftar Event</h2>
            <div class="search-box">
                <label for="search-input">Cari Nama Event</label>
                <input type="text" id="search-input" data-search-col="0" placeholder="Ketik nama event...">
            </div>
            <p id="loading-indicator" style="display:none;">Memuat data...</p>
            <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Nama Event</th>
                        <th>Penyelenggara</th>
                        <th>Tanggal</th>
                        <th>Kuota</th>
                        <th>Kategori</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data event akan diisi di sini lewat event.js (fetch dari data/event.json) -->
                </tbody>
            </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMEVENT &mdash; UTS DPW</p>
    </footer>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/event.js"></script>
</body>
</html>
